#
# Profil de production : activer avec SPRING_PROFILES_ACTIVE=prod
#
# Rien n'a de valeur de repli ici, volontairement. Une variable oubliée doit empêcher le
# démarrage, pas laisser l'application tourner avec le mot de passe du poste de dev ou un
# secret de signature que tout le monde peut lire dans le dépôt.
#
# Variables attendues :
#   DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD
#   JWT_SECRET               (32 octets minimum, aléatoire, propre à l'installation)
#   CORS_ALLOWED_ORIGINS     (origines du front, séparées par des virgules)
#   IGDB_CLIENT_ID, IGDB_CLIENT_SECRET
#
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      # À passer en `validate` dès que les migrations Flyway existeront. `update` laisse
      # Hibernate modifier le schéma tout seul : il n'enlève jamais rien, ne renomme pas,
      # et ne sait pas revenir en arrière — c'est déjà ce qui a contraint la colonne `role`
      # à rester nullable.
      ddl-auto: update
    # Le journal des requêtes n'a pas sa place en production : il ralentit, remplit les
    # disques, et recopie dans les logs le contenu des tables.
    show-sql: false

  jackson:
    # Une pile d'appels renvoyée au client renseigne sur les versions et le découpage du
    # code. GlobalExceptionHandler produit déjà un message lisible pour chaque cas prévu.
    default-property-inclusion: non_null

server:
  error:
    include-stacktrace: never
    include-message: never

gamenote:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    be.technifutur: INFO
    org.hibernate.SQL: WARN
