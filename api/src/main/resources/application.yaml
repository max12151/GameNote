server:
  port: 8080

spring:
  application:
    name: GameNote
  datasource:
    # Valeurs de repli = poste de développement. Elles restent lisibles dans le dépôt, ce
    # qui est acceptable parce qu'elles ne donnent accès à rien d'autre qu'un Postgres
    # local ; toute autre machine passe par les variables d'environnement.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5440/postgres}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Le schéma appartient désormais aux migrations Flyway (dal/src/main/resources/db/
      # migration) : Hibernate ne le modifie plus, il vérifie seulement que les entités
      # correspondent à ce qu'il trouve. Un écart fait échouer le démarrage, au lieu de
      # produire une colonne fantôme découverte trois semaines plus tard en production.
      ddl-auto: validate
    show-sql: true

  flyway:
    # Les bases déjà en service — le poste de développement, et la pile docker dont le
    # script d'init recrée le schéma d'origine — sont marquées à la V1 sans que celle-ci
    # soit rejouée ; seules les migrations suivantes s'y appliquent. Une base vide, elle,
    # reçoit toute la série depuis la V1.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "schema initial (avant Flyway)"

igdb:
  client-id: ${IGDB_CLIENT_ID}
  client-secret: ${IGDB_CLIENT_SECRET}
  token-url: https://id.twitch.tv/oauth2/token
  api-url: https://api.igdb.com/v4

gamenote:
  # Origines autorisées à appeler l'API depuis un navigateur. Le serveur de développement
  # Angular par défaut ; en production, la liste vient de CORS_ALLOWED_ORIGINS.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Comptes promus administrateur au demarrage (moderation des commentaires).
  # Le compte doit deja exister : sinon il sera promu au prochain demarrage.
  admin-usernames: [Max]
  discover:
    # Nombre de jours pendant lesquels un jeu "passe" n'est plus propose a l'utilisateur.
    skip-cooldown-days: 7

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-min-32-bytes-long-1234567890}
  expiration-ms: 86400000